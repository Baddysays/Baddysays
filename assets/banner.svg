<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="baddysays  product engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="45%" stop-color="#12161C"/>
      <stop offset="100%" stop-color="#0E1512"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F0A05A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F0A05A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0A05A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A060"/>
      <stop offset="100%" stop-color="#7EC8A3"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- soft ambient orbs -->
  <circle cx="180" cy="90" r="140" fill="#E8A060" opacity="0.12" filter="url(#soft)"/>
  <circle cx="980" cy="320" r="180" fill="#7EC8A3" opacity="0.10" filter="url(#soft)"/>
  <circle cx="720" cy="60" r="100" fill="#6B8CFF" opacity="0.06" filter="url(#soft)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="420" fill="url(#accent)"/>

  <!-- decorative frame lines -->
  <path d="M48 48 H220" stroke="#E8A060" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M48 48 V120" stroke="#E8A060" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M1152 372 H980" stroke="#7EC8A3" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M1152 372 V300" stroke="#7EC8A3" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- monogram mark -->
  <g transform="translate(72, 150)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#161B22" stroke="#E8A060" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="36" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="url(#accent)">B</text>
  </g>

  <!-- brand -->
  <text x="172" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#F4F1EA" letter-spacing="1">baddysays</text>
  <text x="176" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#A8B0BC" letter-spacing="3.5">PRODUCT ENGINEER  ·  SHIPS REAL THINGS</text>

  <!-- glow line under tagline -->
  <rect x="176" y="248" width="420" height="2" rx="1" fill="url(#glow)"/>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#D7DDE6">
    <rect x="176" y="278" width="118" height="34" rx="17" fill="#1A222C" stroke="#2A3542" stroke-width="1"/>
    <text x="235" y="300" text-anchor="middle">Kotlin</text>

    <rect x="306" y="278" width="118" height="34" rx="17" fill="#1A222C" stroke="#2A3542" stroke-width="1"/>
    <text x="365" y="300" text-anchor="middle">Python</text>

    <rect x="436" y="278" width="118" height="34" rx="17" fill="#1A222C" stroke="#2A3542" stroke-width="1"/>
    <text x="495" y="300" text-anchor="middle">React</text>

    <rect x="566" y="278" width="132" height="34" rx="17" fill="#1A222C" stroke="#2A3542" stroke-width="1"/>
    <text x="632" y="300" text-anchor="middle">C++ / Qt</text>
  </g>

  <!-- right side product stack hint -->
  <g transform="translate(820, 110)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="12" fill="#7EC8A3" letter-spacing="2.5">LIVE PRODUCTS</text>

    <rect x="0" y="20" width="300" height="56" rx="12" fill="#151A21" stroke="#2A3542"/>
    <circle cx="28" cy="48" r="7" fill="#E8A060"/>
    <text x="48" y="44" font-size="16" fill="#F4F1EA" font-weight="600">Saylat</text>
    <text x="48" y="64" font-size="12" fill="#8B95A3">browser for 2G / slow nets</text>

    <rect x="0" y="88" width="300" height="56" rx="12" fill="#151A21" stroke="#2A3542"/>
    <circle cx="28" cy="116" r="7" fill="#7EC8A3"/>
    <text x="48" y="112" font-size="16" fill="#F4F1EA" font-weight="600">Etemenanki</text>
    <text x="48" y="132" font-size="12" fill="#8B95A3">AI document translator</text>

    <rect x="0" y="156" width="300" height="56" rx="12" fill="#151A21" stroke="#2A3542"/>
    <circle cx="28" cy="184" r="7" fill="#6B8CFF"/>
    <text x="48" y="180" font-size="16" fill="#F4F1EA" font-weight="600">Foxik Dispatcher</text>
    <text x="48" y="200" font-size="12" fill="#8B95A3">React ops dashboard</text>
  </g>
</svg>
